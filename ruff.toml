# Style and lint rules (ruff). Run: .venv\Scripts\python.exe -m ruff check .  and  -m ruff format .
line-length = 120
target-version = "py311"
extend-exclude = ["data", "reports", "coverage", "reference"]

[lint]
# pyflakes (F), the core pycodestyle errors (E4, E7, E9), import order (I) and common bug patterns (B)
select = ["E4", "E7", "E9", "F", "I", "B"]

[format]
line-ending = "lf"
