# Topic keywords for the keyword pass (step 4, BRIEF.md "Tagging", point 1). Team-editable.
#
# How a story gets a topic: if ANY keyword of the topic appears in the story's title or summary, the topic
# becomes a candidate. The AI pass later confirms or rejects it, so a keyword that sometimes over-matches
# is fine; a missing keyword means a story is never considered for the topic.
#
# Writing keywords:
#   - Plain phrases, not patterns. Case does not matter. Whole words only: "fare" does not match "welfare".
#   - List real variants yourself: "tunnel road" and "tunnel roads"; "B-SMILE" and "BSMILE".
#   - Kannada: give the stem as headlines spell it; it matches at the start of a word, so suffixes are
#     fine ("ಬೆಂಗಳೂರ" matches "ಬೆಂಗಳೂರಿನಲ್ಲಿ").
#   - local: true  -> the topic counts only when the story also names a place or body in local_context
#     below. Use it when the keywords are generic ("property tax", "power cut").
#   - exclude: [...] -> any of these phrases vetoes the topic (known false matches).
#   - Avoid words that appear in a large share of all news ("Bengaluru", "government", "price").
#
# Every topic_id in topics.csv needs an entry here; a test checks it.
# Drafted by Claude on 4 Oct 2026 from each topic's title and debate angles; tune after the first live run.

