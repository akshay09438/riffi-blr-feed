# ---- gates: what we never pick, and what needs a human's eye

skip_tragedy:      # someone died or was harmed: not a "spicy" post, never picked on its own (rebuilt 29 Sep 2026 after two safety reviews)
  - \bdies\b|\bdied\b|\bdie\b(?!-)|death|deaths|killed|kills|\bdeceased|body (found|of)|bodies|murder|suicide
  # "dead", "no more", "blast" and "succumb" stay broad (a false skip is the safe mistake); only idioms that are never about a person are let through
  - \bdead\b(?![- ](cheap|end|ends|heat|rubber|serious|stock|lock|set on|letter|ringer))|(found|shot|beaten|left|declared|brought|lying) dead|dead body|feared dead
  - \brape[ds]?\b|gang-?rape[ds]?|sexual(ly)? assault|molest|pocso|child abuse|stabbed|lynch|drown(s|ed|ing)?|electrocuted
