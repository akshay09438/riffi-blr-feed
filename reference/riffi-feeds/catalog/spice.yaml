  - (sensex|nifty)[^.]{0,40}(points|pts|higher|lower|flat|ends|closes|opens)|stocks? to (buy|watch)|share price (today|live)
  - \blive (updates?|blog|coverage|news)\b|\blive:|\blive\b.{0,3}$|breaking news live|q[1-4] results|results? (today|date)|ipo gmp|allotment status
